[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-fund-graph"
version = "0.2.0"
description = "基于动态资金图谱的嫌疑人账户识别、关联发现与链路解释原型"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "scikit-learn>=1.4,<2",
  "lightgbm>=4.3,<5",
  "openpyxl>=3.1,<4",
  "pyarrow>=15,<22",
  "duckdb>=1.0,<2",
  "networkx>=3.2,<4",
  "streamlit>=1.33,<2",
  "plotly>=5.20,<7",
  "pydantic>=2.6,<3",
  "PyYAML>=6,<7",
  "Jinja2>=3.1,<4",
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
