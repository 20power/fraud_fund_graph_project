primary_task:
  name: suspect_detection
  positive_labels: [1]
  description: 嫌疑人账户 vs 非嫌疑人账户
auxiliary_task:
  name: broad_risk_detection
  positive_labels: [1, 2]
  description: 嫌疑人或受害人 vs 其它账户
models:
  rule_baseline: true
  logistic_regression: true
  random_forest: true
  lightgbm: true
  two_stage: true
  graph_embedding_experiment: false
selection_metric: pr_auc
random_seeds: [42, 2026, 3407]
bootstrap_iterations: 300
decision_threshold:
  method: validation_f1
logistic_regression:
  C: 1.0
  max_iter: 2000
  class_weight: balanced
random_forest:
  n_estimators: 300
  max_depth: 12
  min_samples_leaf: 3
  class_weight: balanced_subsample
lightgbm:
  n_estimators: 350
  learning_rate: 0.03
  num_leaves: 15
  max_depth: -1
  min_child_samples: 10
  subsample: 0.9
  colsample_bytree: 0.85
  reg_alpha: 0.1
  reg_lambda: 0.5
  class_weight: balanced
probability_calibration:
  enabled: true
  method: sigmoid
